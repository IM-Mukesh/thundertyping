name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-build.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-build-anon-key"
          NEXT_PUBLIC_SITE_URL: "https://herotyping.com"
        run: npm run build
